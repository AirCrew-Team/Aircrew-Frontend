name: CI - Inicial

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-check:
    name: Escaneo de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Buscar secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      # Instala pnpm, Node y las dependencias (con cache entre ejecuciones)
      - name: Configurar pnpm y Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Lint
        run: pnpm lint

      # El script build de Vite ejecuta tsc antes de compilar,
      - name: Build
        run: pnpm build